services:
  - type: web
    name: review
    runtime: node
    # Pre-deploy commands require a paid plan; on free, move the migrate step into buildCommand.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy --config prisma7.config.ts
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Your Render URL, e.g. https://review.onrender.com
      - key: BETTER_AUTH_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      # Index must be 512-dim
      - key: PINECONE_INDEX
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
